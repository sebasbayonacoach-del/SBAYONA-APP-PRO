name: ci

on:
  push:
    branches: [main, bayona-one/visual-integration-v6]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: static security + syntax + performance
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Production verifier
        run: node tools/verify-production.mjs
      - name: Performance budgets
        run: node tools/perf-budget.mjs

  test:
    name: test (tests/*.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Ejecutar batería de contratos y golden biomecánica
        run: node tests/run.mjs

  build-check:
    name: build-check (index.html → recursos existentes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validar referencias locales de index.html
        run: |
          set -euo pipefail
          html=index.html
          test -f "$html"
          refs=$(grep -oE '(src|href)="[^"]+"' "$html"             | sed -E 's/^(src|href)="//; s/"$//'             | grep -vE '^(https?:|//|data:|#|mailto:|tel:|\{)' || true)
          missing=0
          for r in $refs; do
            path=${r%%[\?\#]*}
            if [ ! -e "$path" ]; then
              echo "::error file=$html::Referencia rota: $r"
              missing=1
            fi
          done
          test "$missing" -eq 0
