name: BAYONA Android beta · PROPLAYER
on:
  push:
    branches:
      - bayona-one/android-v102-proplayer-videos-20261010
      - bayona-one/android-v102-signed-release-20261010
      - bayona-one/visual-integration-v6
    tags:
      - v1.0.2-beta.1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        with:
          # La acción instala "tools" por defecto, un paquete ya retirado.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Dependencias Capacitor
        working-directory: mobile
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Comprobar catálogo y vídeo sin suplantaciones
        run: node tests/android-proplayer-catalog-eval.mjs

      - name: Generar contenido estático para Android
        run: npm run mobile:pack

      - name: Comprobar catálogo dentro del paquete
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          base=Path("mobile/web-build")
          rows=json.loads((base/"trainingym/catalog.json").read_text())
          assert len(rows)==3141, len(rows)
          assert not (base/"trainingym/blob-manifest.json").exists()
          for f in ("index.html","misiones.html","media/squat.mp4","media/bench.mp4","media/burpee.mp4"):
            if f == "media/burpee.mp4":
              assert not (base/f).exists(), "No incluir vídeo ajeno sin licencia"
            else:
              assert (base/f).is_file(), f
          print("CATÁLOGO_ANDROID_OK: 3141 fichas; 11 demos base; sin datos privados")
          PY

      - name: Integrar contenido en Capacitor
        working-directory: mobile
        run: npx cap sync android

      - name: Restaurar firma beta desde Secret de GitHub Actions
        env:
          BETA_KEYSTORE_BASE64: ${{ secrets.BAYONA_ANDROID_BETA_DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -z "$BETA_KEYSTORE_BASE64" ]; then
            echo "Falta la clave segura de firma beta; no distribuir una APK con certificado diferente." >&2
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$BETA_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          # El usuario ya tiene 1.0.1 instalada: si cambia este certificado,
          # Android rechazará la actualización y se arriesgan sus datos locales.
          EXPECTED=8382904dbe97e2eb8eea76ea14affcc653f75f63705e9703af4f8b3021b3b0dd
          ACTUAL="$(keytool -list -v -keystore "$HOME/.android/debug.keystore" \
            -storepass android -alias androiddebugkey | \
            awk '/SHA256: / {print $2}' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "La firma restaurada no coincide con la APK beta anterior; se bloquea publicación." >&2
            echo "Certificado esperado: $EXPECTED / restaurado: $ACTUAL" >&2
            exit 1
          fi
          echo "Firma beta confirmada igual a la versión 1.0.1."
          # Gradle/AGP puede usar un almacén debug efímero distinto al de HOME.
          # El proyecto Android recibe explícitamente el almacén comprobado.
          echo "BAYONA_ANDROID_BETA_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"

      - name: Compilar APK Android beta
        working-directory: mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verificar APK, firma y catálogo empaquetado
        run: |
          set -euo pipefail
          APK=mobile/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$APK" |
            grep -F 'Signer #1 certificate SHA-256 digest: 8382904dbe97e2eb8eea76ea14affcc653f75f63705e9703af4f8b3021b3b0dd'
          # Misma identidad de firma de 1.0.1: actualización sin borrar datos.
          cp "$APK" mobile/android/app/build/outputs/apk/debug/BAYONA-Android-1.0.2-beta.1.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep '^package:'
          unzip -Z1 "$APK" > /tmp/bayona-apk-entries.txt
          grep -qx 'assets/public/trainingym/catalog.json' /tmp/bayona-apk-entries.txt
          grep -qx 'assets/public/media/squat.mp4' /tmp/bayona-apk-entries.txt
          grep -qx 'assets/public/misiones.html' /tmp/bayona-apk-entries.txt
          if grep -q 'assets/public/private-trainingym/' /tmp/bayona-apk-entries.txt; then
            echo "Se han incluido medios privados por error" >&2
            exit 1
          fi
          unzip -p "$APK" assets/public/trainingym/catalog.json |
            python3 -c 'import json,sys; x=json.load(sys.stdin); assert len(x)==3141, len(x); print("APK_PROPLAYER_OK", len(x))'
          sha256sum "$APK"

      - name: Publicar APK verificable como artefacto de CI
        uses: actions/upload-artifact@v4
        with:
          name: BAYONA-Android-1.0.2-beta1
          path: mobile/android/app/build/outputs/apk/debug/BAYONA-Android-1.0.2-beta.1.apk
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    # Publicar únicamente con un tag explícito: otros commits nunca deben
    # reemplazar el APK que ya están probando los usuarios.
    if: github.ref == 'refs/tags/v1.0.2-beta.1'
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: BAYONA-Android-1.0.2-beta1
          path: release

      - name: Publicar APK firmado en GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=v1.0.2-beta.1
          APK=release/BAYONA-Android-1.0.2-beta.1.apk
          test -s "$APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
            gh release edit "$TAG" --draft=false --prerelease
          else
            gh release create "$TAG" "$APK" --prerelease \
              --title 'BAYONA Android 1.0.2-beta.1 · Rutinas y PROPLAYER' \
              --notes 'Beta Android. Catálogo de 3.141 ejercicios offline, vídeos de PROPLAYER online. Misma firma de 1.0.1-beta.1. Coach demo local: sin nube/Stripe certificados y sin incluir MP4 de terceros sin licencia.'
          fi
          gh release view "$TAG" --json isDraft,url,assets \
            --jq '{draft:.isDraft,url:.url,assets:[.assets[]|{name:.name,size:.size}]}'
