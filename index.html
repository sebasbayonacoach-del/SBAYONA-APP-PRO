<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#f1ede5" />
<title>BAYONA — Tu vida es el juego</title>
<link rel="stylesheet" href="fonts/fonts.css" />
<link rel="stylesheet" href="css/style.css?v=8" />
<link rel="stylesheet" href="css/aurum.css?v=3" />
<link rel="stylesheet" href="css/motion.css?v=3" />
<link rel="manifest" href="manifest.webmanifest" />
<script>
  /* firma visual v3 «CINE»: se aplica antes del primer pintado (sin parpadeos).
     CINE = blanco + naranja · NOCHE = negro + naranja (modo nocturno). */
  try {
    var ap = JSON.parse(localStorage.getItem('bayona.appearance.v1') || '{}');
    var d = document.documentElement;
    var legacy = { marfil: 'cine', noche: 'noche' };
    d.dataset.theme = 'naranja';
    d.dataset.mode = legacy[ap.mode] || 'cine';
    d.dataset.font = 'claude';
    d.dataset.density = ap.density || 'comoda';
    d.dataset.radius = ap.radius || 'suave';
    d.dataset.glass = ap.glass === undefined ? 'on' : ap.glass;
    d.dataset.glow = ap.glow || 'bajo';
    d.dataset.scale = ap.scale || '100';
    d.dataset.motion = ap.motion || 'pleno';
    d.style.colorScheme = d.dataset.mode === 'noche' ? 'dark' : 'light';
  } catch (e) {}
</script>
<script type="importmap">
  { "imports": { "three": "./vendor/three.module.js" } }
</script>
</head>
<body>
  <!-- ============ WORLD LAYER (3D) ============ -->
  <div id="scene-wrap">
    <canvas id="scene"></canvas>
    <div id="scene-vignette"></div>
    <div id="film-grain" aria-hidden="true"></div>
    <div id="transition-veil"></div>
  </div>
  <div id="frame-top" aria-hidden="true"></div>
  <div id="frame-bot" aria-hidden="true"></div>
  <div id="aurora" aria-hidden="true"></div>

  <!-- ============ INGRESO · portada cinematográfica ============ -->
  <div id="entry" role="dialog" aria-label="Entrar en BAYONA">
    <div class="e-corner">
      <span class="brand-mark">◈</span>
      <span class="brand-name">BAYONA</span>
    </div>
    <div class="e-kicker">TU VIDA ES EL JUEGO</div>
    <h1 class="e-title">CUIDA<br />A TU <em>PERSONAJE</em></h1>
    <div class="e-line"></div>
    <div class="e-sub">Cuidar a tu personaje es cuidarte a ti. Entrena, come, descansa — y él vive contigo.</div>
    <div class="e-actions">
      <button class="e-enter" id="entry-go">ENTRAR</button>
      <div class="e-modes" role="group" aria-label="Luz">
        <button class="e-mode on" data-mode="cine">◐ CINE</button>
        <button class="e-mode" data-mode="noche">● NOCHE</button>
      </div>
    </div>
  </div>

  <!-- ============ HUD LAYER · mínimo ============ -->
  <div id="hud">
    <header id="topbar">
      <div class="brand">
        <span class="brand-mark">◈</span>
        <span class="brand-name">BAYONA</span>
      </div>
      <div class="top-right">
        <button id="mode-chip" class="chip" title="Cine / Noche">◐ <b id="mode-name">CINE</b></button>
        <button id="level-chip" class="chip chip-level" title="Progreso">
          <span class="lvl">NIVEL <b id="lvl-num">1</b></span>
          <span class="rank" id="rank-name">INICIADO</span>
          <span class="xpbar"><i id="xp-fill"></i></span>
          <span class="xptxt mono" id="xp-txt">0 / 250 XP</span>
        </button>
        <div class="wallet mono">
          <span class="cur bp" title="PUNTOS BAYONA">◆ <b id="cur-points">0</b></span>
          <span class="cur cr" title="CRÉDITOS">✦ <b id="cur-credits">0</b></span>
        </div>
      </div>
    </header>

    <div id="move-hint">CLIC · MOVER PERSONAJE &nbsp;·&nbsp; WASD &nbsp;·&nbsp; ARRASTRAR · CÁMARA</div>
    <div id="stick" aria-label="Joystick de movimiento"><i></i></div>
  </div>

  <!-- ============ PANEL LATERAL · TODO vive aquí ============ -->
  <aside id="drawer" aria-live="polite">
    <div class="drawer-head">
      <h2 id="drawer-title">INICIO</h2>
      <div class="drawer-sub mono" id="drawer-sub">MUNDO BAYONA</div>
      <button id="drawer-close" aria-label="Colapsar panel">✕</button>
    </div>
    <nav id="panel-nav" aria-label="Mundos BAYONA">
      <button class="rail-btn active" data-go="home">◈ INICIO</button>
      <button class="rail-btn" data-go="hoy">◔ HOY</button>
      <button class="rail-btn" data-go="training">▲ ENTRENAR</button>
      <button class="rail-btn" data-go="nutrition">◍ COMER</button>
      <button class="rail-btn" data-go="trabajo">▤ TRABAJO</button>
      <button class="rail-btn" data-go="recovery">✚ RECUPERAR</button>
      <button class="rail-btn" data-go="mind">◌ MENTE</button>
      <button class="rail-btn" data-go="plan">◇ PLAN</button>
      <button class="rail-btn" data-go="coachos">◆ COACH</button>
      <button class="rail-btn" data-go="armory">✦ ARMARIO</button>
      <button class="rail-btn" data-go="progress">⇗ PROGRESO</button>
      <button class="rail-btn" data-go="core">● CORE</button>
      <button class="rail-btn" data-go="appearance">◐ DISEÑO</button>
      <button class="rail-btn" data-go="more">⚙ MÁS</button>
    </nav>
    <div id="drawer-body"></div>
    <div id="panel-foot">
      <span class="dotline"><i class="live"></i> BAYONA · EN VIVO</span>
      <span id="foot-hint">MUEVE A TU PERSONAJE LIBREMENTE</span>
    </div>
  </aside>

  <!-- ============ MODAL / CINEMATIC LAYER ============ -->
  <div id="modal-layer" class="hidden">
    <div id="modal-box"></div>
  </div>

  <!-- ============ TOASTS ============ -->
  <div id="toasts"></div>

  <script type="module" src="js/main.js"></script>
  <!-- ATELIER · personalización de la interfaz + motor de movimiento -->
  <script type="module" src="js/ui/motion.js"></script>
  <!-- MOVIMIENTO LIBRE · clic / WASD / joystick / cámara -->
  <script type="module" src="js/move.js"></script>
  <!-- GEMELO-1 · cámara + mocap: CARGA DIFERIDA (MediaPipe solo cuando hace falta) -->
  <script type="module">
    const loadVision = () => import("./js/vision/boot.js");
    if ("requestIdleCallback" in window) requestIdleCallback(loadVision, { timeout: 4000 });
    else setTimeout(loadVision, 1200);
  </script>
  <!-- HEALTH MAP · cuestionario de salud (autocontenido, ver js/health/) -->
  <script type="module" src="js/health/healthUI.js"></script>
  <!-- BRIDGE · GEMELO-1 + Health Map → estado/XP/journey del juego -->
  <script type="module" src="js/bridge.js"></script>
  <!-- ONBOARDING ÚNICO · primer arranque -->
  <script type="module" src="js/onboarding.js"></script>
  <!-- DIARIO DE SESIÓN · recap cinematográfico de las series reales -->
  <script type="module" src="js/diary/sessionDiary.js"></script>
</body>
</html>
